name: CI

# Pull requests run this directly. On main it runs as the first job of "Deploy to Gust",
# so a push that fails the checks is never deployed.
on:
  pull_request:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Builds the site and runs the axe suite against it (playwright.config.ts starts the server).
      - run: pnpm exec playwright install chromium
      - run: pnpm test:e2e
